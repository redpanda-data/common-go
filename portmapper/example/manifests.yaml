# Demo manifests for the port-mapper example controller.
#
# The Service is intentionally selectorless -- the native EndpointSlice
# controller ignores it, and port-mapper publishes its slices instead based on
# the alignment annotations below:
#
#   Service: my-service
#     ├── port 8080 (http)  → pods a, b, c
#     └── port 8443 (https) → pods b, c, d
apiVersion: v1
kind: Namespace
metadata:
  name: port-mapper-demo
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
  namespace: port-mapper-demo
  annotations:
    port-mapper.example.com/group: my-group
spec:
  # No selector on purpose.
  ports:
    - name: http
      port: 8080
      protocol: TCP
    - name: https
      port: 8443
      protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-a
  namespace: port-mapper-demo
  annotations:
    port-mapper.example.com/group: my-group
    port-mapper.example.com/ports: http
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-b
  namespace: port-mapper-demo
  annotations:
    port-mapper.example.com/group: my-group
    port-mapper.example.com/ports: http,https
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-c
  namespace: port-mapper-demo
  annotations:
    port-mapper.example.com/group: my-group
    port-mapper.example.com/ports: http,https
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-d
  namespace: port-mapper-demo
  annotations:
    port-mapper.example.com/group: my-group
    port-mapper.example.com/ports: https
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
