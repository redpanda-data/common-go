name: "Lint"

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yaml'
      - '.github/workflows/golangci-lint.yaml'
  pull_request:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yaml'
      - '.github/workflows/golangci-lint.yaml'

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  LINT_DIRS: '["api", "rpadmin", "secrets", "net", "rpsr", "redpanda-otel-exporter", "authz", "kvstore", "license", "licenseupdater", "kube", "telemetry", "ocsf", "portmapper", "protoc-gen-go-sr-normalize"]'

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull requests lint only the modules they touch. Pushes to main and
      # changes to the shared lint setup lint every module.
      - id: dirs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "dirs=$LINT_DIRS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          if echo "$changed" | grep -qxE '\.golangci\.yaml|\.github/workflows/golangci-lint\.yaml'; then
            echo "dirs=$LINT_DIRS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dirs=$(echo "$changed" | cut -d/ -f1 | sort -u | jq -Rsc --argjson all "$LINT_DIRS" 'split("\n") | map(select(. as $d | $all | index($d)))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  golangci:
    name: lint (${{ matrix.dir }})
    needs: changes
    if: needs.changes.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4

      # golangci-lint can only type-check against a Go toolchain no newer
      # than the one it was built with; v2.13.2 cannot read Go 1.27 export
      # data. Move this together with GOLANGCI_LINT_VERSION.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.dir }}
          args: --timeout=10m --config=../.golangci.yaml
          # A restored analysis cache makes nolintlint report false "unused
          # directive" errors for directives that suppress real issues.
          skip-cache: true
          skip-save-cache: true

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          # Heavy usage of the action can result in workflow run failures caused by rate limiting.
          # GitHub provides a more generous allowance for Authenticated API requests.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fmt
        run: task fmt
